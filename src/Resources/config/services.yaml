parameters:
  logger_bundle.applicationNameDefault: unknown
  logger_bundle.componentNameDefault: unknown

  logger_bundle.applicationName: '%env(default:logger_bundle.applicationNameDefault:APPLICATION_NAME)%'
  logger_bundle.componentName: '%env(default:logger_bundle.componentNameDefault:COMPONENT_NAME)%'

  logger_bundle.exception_classes:
      - Symfony\Component\HttpKernel\Exception\NotFoundHttpException
      - Symfony\Component\HttpKernel\Exception\BadRequestHttpException
      - Symfony\Component\HttpKernel\Exception\AccessDeniedHttpException
      - Symfony\Component\HttpKernel\Exception\UnsupportedMediaTypeHttpException
      - Symfony\Component\Security\Core\Exception\AccessDeniedException

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      $batchMode: !php/const Monolog\Formatter\JsonFormatter::BATCH_MODE_NEWLINES
      $includeStacktraces: '%kernel.debug%'

  Msstc4Symfony\LoggerBundle\:
    resource: '../../'
    exclude:
      - '../../DependencyInjection/'
      - '../../Monolog/Handler/'
      - '../../Monolog/Processor/'
      - '../../LoggerBundle.php'

  # Stream handlers need one JSON document per line; the Monolog default is false.
  Msstc4Symfony\LoggerBundle\Monolog\Formatter\JsonFormatter:
    arguments:
      $appendNewline: true

  # Processors
  Msstc4Symfony\LoggerBundle\Monolog\Processor\ConsoleProcessor:
    tags:
      - { name: monolog.processor }

  Msstc4Symfony\LoggerBundle\Monolog\Processor\EnvironmentProcessor:
    tags:
      - { name: monolog.processor }

  Msstc4Symfony\LoggerBundle\Monolog\Processor\ExceptionContextProcessor:
    tags:
      - { name: monolog.processor }

  Msstc4Symfony\LoggerBundle\Monolog\Processor\UserProcessor:
    tags:
      - { name: monolog.processor }

  Msstc4Symfony\LoggerBundle\Monolog\Processor\WebProcessor:
    tags:
      - { name: monolog.processor }
